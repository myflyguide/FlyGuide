    { k: ["leader", "tippet", "shock"], a: "Striper: 9ft to 16 or 20lb, shorten to 3ft off a sink tip. Albie: 10 to 12ft to 15 or 20lb fluoro, they see everything. Bonefish: 10 to 12ft to 12 or 16lb. Tarpon: class section plus 60 to 80lb fluoro shock. Snook: always 30 to 40lb shock, the gill plates are razors. Redfish: 9ft to 16 or 20lb, they are not leader shy, they are presentation shy." },

    { k: ["license", "regs", "regulations", "legal", "keep", "season limit"], a: "Rules change yearly and by state, so I will not quote you a slot limit from memory. The regs links in the footer go to the actual agencies. Non-negotiables that do not change: Florida tarpon is catch and release, over 40 inches stays in the water. Bahamas bonefish are catch and release and you need a flats permit. Snook needs an FWC permit stamp and the seasons close after cold kills." },
    { k: ["what rod", "which rod", "rod weight", "setup"], a: "One rod to travel the whole map: a 9wt with a floating and an intermediate line covers striper, snook, redfish, albies, and Bahamas bones in wind. Add an 8wt floater for calm flats and a 11 or 12wt if tarpon are the mission. Nobody ever came home complaining the rod was too big in the wind." },
    { k: ["confidence", "accuracy", "how accurate", "probability"], a: "Every day on the 30-day board carries a confidence number. Tides are astronomy, they are basically locked a year out. Weather is real forecast out to about 16 days and climatology after that. So day 3 might read 88 percent and day 26 reads 40, which means treat it as a lean, not a promise. Recheck inside a week, the board updates itself every time you open it." },
    { k: ["mullet run"], a: "September into October, the fall mullet run pours down the Florida Atlantic coast and every predator with a pulse follows it: snook in the trough, tarpon crashing pods, big jacks. Beach at dawn, big white baitfish fly or a Gurgler, cast parallel and hang on. It is the best month of shore fishing in the state." },
    { k: ["tailing", "tailer", "flood tide"], a: "Tailing fish are feeding fish with their heads down and guards down. Reds tail on flood tides over spartina grass, Jacksonville through the Lowcountry, biggest tides of August through October. Bones tail on early incoming across soft flats. Lead them 2 to 3 feet, land it soft, move it only when they can see it, and do not cast at the tail, the dinner end is the other end." },
    { k: ["charleston", "flood tide", "lowcountry", "spring tide"], a: "Charleston runs on tide height, not just tide stage. When the predicted high at the Charleston Harbor station tops about 5.7 feet, the water climbs into the short spartina and the flood tide tailing game fires: Copahee, the ACE, the flats behind Capers. Below that number the grass never floods, so fish the oyster points on the last of the ebb instead. September and October add the jetty bulls outside the harbor. The app gates flood-flat scores on tide height, so a low score on a flood spot usually means the grass stays dry that day, not that the fish left." },
    { k: ["keys season", "when tarpon keys", "migration timing"], a: "Keys tarpon in one breath: resident and juvenile fish all winter in the basins and harbors, the ocean-side migration builds late March, peaks late April through mid-June, and the palolo worm moons in May and June are the two best evenings of the year. Bones fish year-round with spring and fall the kindest. Summer is hot, glassy, and underrated at dawn." },
    { k: ["everglades season", "flamingo winter", "glades"], a: "The Glades run backwards from the postcard: winter is prime. November through March the dry season cleans and cools the water, snook and reds stack the creeks and outside points on the falling tides, and tarpon wake up in the rivers on any warm spell. Summer moves the game to dawn, thunderstorms own the afternoons, tarpon own the passes." },
    { k: ["tampa bay season", "tampa"], a: "Tampa Bay's calendar: winter negative low tides expose the flats and gang reds in the potholes, spring wakes the snook on the mangrove lines, May and June send tarpon strings down the beaches and through the passes, and fall floods tail reds on every grass flat while the mullet run feeds everything. There is no off month, only different water." },
    { k: ["bahamas diy", "diy bonefish", "flats permit"], a: "Bahamas DIY basics: a flats fishing permit is required nationwide and bones are catch and release, full stop. Rent the car or cart, fish the young flood on walkable sand, and give lodges and guides working clients the flat, there is always another one. Respect settlement water, buy lunch locally, and the island opens up. Best DIY bases in the app: Cherokee, Savannah Sound, Deep Creek, Exuma, Long Island, Bimini, Harbour Island, Green Turtle." },
    { k: ["maine season", "maine stripers"], a: "Maine striper math: the fish arrive with the alewives in late May, June is the show on the river mouths (Kennebec, Saco, Scarborough, York), July and August shift to dawn tides and the cold-water beaches, and September sends everything south eating on the way. If the rivers run warm in high summer, fish the coast, the Piscataqua and the beaches stay cold." },
    { k: ["jersey spring", "bunker run", "spring bass"], a: "The Jersey spring in order: April warms the rivers first, Graveling Point and the Mullica start it, then the adult bunker schools arrive along the beaches late April into June and the biggest bass of the year ride under them. Find the pods at dawn, throw the biggest fly you own, and let it fall through. Fall reverses the parade with sand eels and albies from late September." },
    { k: ["nantucket", "nantucket season", "the island"], a: "Nantucket in one arc: June is the squid month, the heaviest bass of the year in the south shore wash and the rips at Great Point and Muskeget. July and August run on sand eels at dawn, flats sight fishing at Coatue and Eel Point midday. Mid September flips the switch: bay anchovies arrive and albies run the east side from Sankaty to Great Point into late October while bass funnel west along the south shore bars. Safety is part of the local knowledge: the south shore break punishes inattention, and the seal herds around Great Point and Muskeget brought white sharks, so knee deep is the island's wading rule on the outside beaches." },

  if (/where|which spot|best (spot|bet|water)|somewhere|other spot|instead/.test(s) && env.ranking && env.ranking.length) {
    const top = env.ranking[0];
    return { text: `The call for ${SPP(env.sp)} today is ${top.spot.name} (${top.spot.area}), ${to10(top.peak)}/10. ${whyLine(top.spot, env.sp, env.date, top.best)} Backup: ${env.ranking[1] ? env.ranking[1].spot.name : "none scoring"}.`, pickId: top.spot.id };
  }
  if (has(/\b(best day|when should|next week|this month|30 day|forecast)\b/) && env.board && env.board.length) {
    const b = [...env.board].sort((a, z) => z.peak * z.conf - a.peak * a.conf)[0];
    return { text: `Best bet in the next 30: ${DOW[b.date.getDay()]} ${MN[b.date.getMonth()]} ${b.date.getDate()}, scoring ${to10(b.peak)}/10 at ${b.conf}% confidence. Inside a week that number firms up, recheck before you burn the gas.` };
  }
  if (has(/\b(book|podcast|learn|read|library|source)\b/)) return { text: `The library behind this thing: ${KB.canon.join("; ")}. Start with Tabory if you fish the Northeast and Dick Brown if the flats call you.` };
  if (has(/\b(tide|water temp|wind|weather|moon)\b/) && env.cond) return { text: env.cond };
  return { text: `Ask me like you'd ask the dock: "where should I fish Saturday", "why is ${env.spotName} only a ${to10(env.dm ? env.dm.peak : 50)}", "what tide tonight", "should I bother tomorrow", "what do ${spName(env.sp)}s eat in ${MONFULL[env.date.getMonth()]}", "what color fly in dirty water". I cover ${CORR.map(c => c.short).join(", ")}, every spot on the board.` };
}

/* ---------- App ---------- */
function App() {

  }, [q]);

  const [hitRate, setHitRate] = useState(null);

    SB.from("reports").select("spot_id,day,grade").then(({ data }) => { if (!alive) return; const m = {}; (data || []).forEach((r) => { m[r.spot_id + "|" + r.day] = r.grade; }); setGraded(m); }).catch(() => {});

  }, [user ? user.id : null]);
  useEffect(() => {
    if (!SB) return;
    SB.rpc("fg_hit_rate").then(({ data }) => { if (data && data.n8 >= 10) setHitRate(data); }).catch(() => {});
  }, []);
  const openLog = () => { if (!SB) return; if (!user) { setAuthMsg(""); setAuthOpen(true); return; } setLogForm({ species: sp, len: "", fly: "" }); setLogMsg(""); setLogOpen(true); };
  const saveCatch = async () => {
    if (!SB || !user) return;
    const lenRaw = logForm.len.trim();
    const len = lenRaw === "" ? null : parseFloat(lenRaw);
    if (lenRaw !== "" && (!isFinite(len) || len <= 0 || len > 120)) { setLogMsg("Length in inches, numbers only."); return; }
    const row = { user_id: user.id, spot_id: spot.id, species: logForm.species || sp,
      length_in: len, fly: logForm.fly.trim() || null,
      score: dm ? dm.peak : null,
      tide: tsNow ? (tsNow.rising ? "flood" : "ebb") + (tsNow.rate < 0.35 ? " near slack" : "") : "no feed",
      wind: Math.round(ctxToday.windByHour[12] != null ? ctxToday.windByHour[12] : ctxToday.windClimo) + " mph",
      temp: (ctxToday.sst + sstOffFor(spot, date)) + "F",
      moon: moonName(moonP), mode };
    setLogMsg("Logged. Snapshot saved with it.");
    try { const { data } = await SB.from("catches").insert(row).select().single(); setCatches((p) => [data || { ...row, id: "tmp-" + Date.now(), caught_at: new Date().toISOString() }, ...p].slice(0, 6)); } catch (e) {}
    setTimeout(() => setLogOpen(false), 700);
  };
  const sendGrade = async (g) => {
    if (!SB) return; if (!user) { setAuthMsg(""); setAuthOpen(true); return; }

    if (graded[key] != null) return;
    setGraded((p) => ({ ...p, [key]: g }));
    try { await SB.from("reports").insert({ user_id: user.id, spot_id: spot.id, day: iso(today), grade: g, score_called: board[0] ? board[0].peak : (dm ? dm.peak : null) }); } catch (e) {}
  };

  /* home map instance + locate */
  const homeMapObj = useRef(null);
  const youMarker = useRef(null);
  const zoomMapToMe = () => {
    if (!navigator.geolocation) { setGeoMsg("Location not available in this browser. Type your town instead."); return; }

    navigator.geolocation.getCurrentPosition(
      (pos) => {

        if (youMarker.current) { try { m.removeLayer(youMarker.current); } catch (e) {} }

  const spots = useMemo(() => SPOTS.filter((s) => s.c === cid && (s.sp[sp] || 0) > 0), [cid, sp]);

  useEffect(() => { if (!cor.species.includes(sp)) setSp(cor.species[0]); }, [cid]);
  const firstRun = useRef(true);
  const skipReset = useRef(false);
  useEffect(() => { if (firstRun.current) { firstRun.current = false; return; } if (skipReset.current) { skipReset.current = false; return; } setManual(false); }, [cid, sp, mode]);

  /* tide fetch per station, 32 day range */
  const fetchStation = (st) => {

    const b = ymd(addDays(today, -1)), e = ymd(addDays(today, 31));
    fetch(`https://api.tidesandcurrents.noaa.gov/api/prod/datagetter?product=predictions&application=flyguide&begin_date=${b}&end_date=${e}&datum=MLLW&station=${st}&time_zone=lst_ldt&units=english&interval=hilo&format=json`)

      .catch(() => {});
  };
  useEffect(() => { fetchStation(spot.station); }, [spot.station]);

  /* Bahamas via WorldTides when keyed */
  useEffect(() => {

    let alive = true;
    fetch(`https://www.worldtides.info/api/v3?extremes&lat=${spot.lat}&lon=${spot.lng}&start=${Math.floor(today / 1000)}&length=2764800&key=${CFG.WORLDTIDES_KEY}`)

      .then((r) => r.json())

  const [sstLive, setSstLive] = useState(null);

            const j2 = await r2.json();
            const row = j2.table && j2.table.rows && j2.table.rows[0];
            const c2 = row && parseFloat(row[1]);
            if (isFinite(c2) && c2 > -3 && c2 < 40) { set(c2 * 9 / 5 + 32, "buoy " + b); return; }
          } catch (e) {}
          const r = await fetch(`https://www.ndbc.noaa.gov/data/realtime2/${b}.txt`);
          const txt = await r.text();
          const lines = txt.trim().split("\n");
          const cols = lines[0].replace(/^#/, "").trim().split(/\s+/);
          const wi = cols.indexOf("WTMP");
          if (wi >= 0) {
            for (let i = 2; i < Math.min(lines.length, 14); i++) {
              const p = lines[i].trim().split(/\s+/);
              const c = parseFloat(p[wi]);
              if (isFinite(c) && c > -3 && c < 40) { set(c * 9 / 5 + 32, "buoy " + b); return; }
            }
          }
        }
      } catch (e) {}
      try {
        const r = await fetch(`https://marine-api.open-meteo.com/v1/marine?latitude=${spot.lat}&longitude=${spot.lng}&hourly=sea_surface_temperature&temperature_unit=fahrenheit&forecast_days=1`);
        const j = await r.json();
        const arr = (j.hourly && j.hourly.sea_surface_temperature) || [];
        for (let i = arr.length - 1; i >= 0; i--) { if (arr[i] != null) { set(arr[i], "satellite at the spot"); return; } }

      .then((r) => r.json())

        if (!alive || !j.hourly) return;
        const acc = {};
        j.hourly.time.forEach((t, i) => { const d = t.slice(0, 10); (acc[d] = acc[d] || []).push(j.hourly.sea_surface_temperature[i]); });

  /* context builder for a given date, keyed to the spot's own corridor */

    const events = s.station ? tides[s.station] : tides["bah:" + s.id];

    let sstV = (sst[s.c] && sst[s.c][key] != null) ? sst[s.c][key] : Math.round(lerpArr(sc.sstFallback, dd));
    if (sstLive && sstLive.key === s.id) {
      const tKey = iso(today);

    }
    return {
      events: shifted || null,
      windByHour: (W.windByDate && W.windByDate[key]) || {},
      dirByHour: (W.dirByDate && W.dirByDate[key]) || {},
      cloudByHour: (W.cloudByDate && W.cloudByDate[key]) || {},
      windClimo: lerpArr(sc.windClimo, dd),
      sun: W.sun && W.sun[key] ? W.sun[key] : null,
      sst: sstV, mode
    };
  };

  const dayModels = useMemo(() => spots.map((s) => ({ spot: s, ...computeDay(s, sp, date, ctxFor(date, s)) })),
    [spots, sp, date, mode, tides, wx, sst, sstLive]);
  const ranking = useMemo(() => [...dayModels].sort((a, b) => b.peak - a.peak), [dayModels]);
  const topId = ranking[0] ? ranking[0].spot.id : null;
  useEffect(() => { if (!manual && topId) setSpotId(topId); }, [topId, manual]);
  const dm = dayModels.find((d) => d.spot.id === spot.id) || ranking[0] || null;
  const dmById = (id) => dayModels.find((d) => d.spot.id === id);
  const [view, setView] = useState(hash.spot ? "spot" : "home");
  useEffect(() => { if (/access_token|refresh_token|error_description|token_type/.test(location.hash)) return; if (view === "spot") history.replaceState(null, "", `#spot=${spot.id}&c=${cid}&sp=${sp}`); else history.replaceState(null, "", location.pathname + location.search); }, [spot.id, cid, sp, view]);
  const homeSpBest = useMemo(() => {
    const out = {};
    Object.keys(SPX).forEach((k) => {
      let best = null;
      SPOTS.forEach((s) => { if ((s.sp[k] || 0) > 0) { const d = computeDay(s, k, today, ctxFor(today, s)); if (!best || d.peak > best.peak) best = { spot: s, peak: d.peak }; } });
      if (best) out[k] = best;

    const tband = SPX[sp].temp;
    const sstSpot = ctxToday.sst + sstOffFor(spot, date);
    const spS = spotSeasonFor(spot, date);
    const weak = [];
    if (spS < 0.4 && spot.seasonNote) weak.push(spot.seasonNote.toLowerCase().replace(/\.$/, ""));
    else if ((b.seas || 0) < 0.5) weak.push("the calendar (shoulder to off season here)");
    if ((b.temp || 1) < 0.6) weak.push(`water temp (${sstSpot}F against the ${tband.lo} to ${tband.hi} slot)`);
    if ((b.tide || 1) < 0.8) weak.push("tide timing (between the good windows)");
    if ((b.spd || 0) > 15) weak.push(`wind (${Math.round(b.spd)} mph)`);
    if (spot.sight && (b.sight || 1) < 0.7) weak.push("sight conditions (cloud or chop on the water)");
    const strong = [];
    if ((b.seas || 0) >= 0.8) strong.push("prime season");
    if ((b.temp || 0) >= 0.9) strong.push("water temp in the slot");
    if ((b.tide || 0) >= 1) strong.push("good tide movement");
    const windowLine = dm && dm.windows.length ? `Bite windows: ${fmtWin(dm.windows)}.` : "No hour clears the bar today, it's a grind tide.";
    const nx = (ctxToday.events || []).filter((e) => e.date > now).slice(0, 2).map((e) => `${e.hl === "H" ? "high" : "low"} ${clock(e.date)}`).join(", ");
    const tideLine = nx ? `Next tides: ${nx}.` : "No tide feed for this water.";
    const explainLine = dm ? `${spot.name} is ${to10(dm.peak)}/10 today. ${strong.length ? "Working for you: " + strong.join(", ") + "." : ""} ${weak.length ? "Holding it back: " + weak.join(", ") + "." : "Nothing major against it, the ceiling is just the season."} ${windowLine}` : "Still pulling data, ask me in a second.";
    const statusLine = dm ? `${spot.name} right now: ${to10(dm.peak)}/10 at ${conf}% confidence for ${SPP(sp)}, water ${sstSpot}F. ${windowLine} ${tideLine}` : "Still pulling data, ask me in a second.";
    const nb = blockOfHour(now.getHours());
    const ft = rankFlies(sp, nb, clarityFor(ctxToday));
    const flyLine = ft.length ? `Right now (${nb}, water reads ${clarityFor(ctxToday)}): 1) ${ft[0].f.n} ${ft[0].f.sz}, ${ft[0].f.why.toLowerCase()}. ${ft[1] ? "2) " + ft[1].f.n + " " + ft[1].f.sz + ". " : ""}${ft[2] ? "3) " + ft[2].f.n + " " + ft[2].f.sz + "." : ""}` : SPX[sp].flies;
    const env = { cid, sp, date, ranking, board, dm, dmById, cond: condLine, spotName: spot.name, spotObj: spot, today, conf, explainLine, windowLine, tideLine, statusLine, flyLine,
      rankFor: (dd) => spots.map((x) => ({ spot: x, ...computeDay(x, sp, dd, ctxFor(dd, x)) })).sort((a, z) => z.peak - a.peak),
      dayFor: (sid, dd) => { const x = (sid && SPOTS.find((y) => y.id === sid)) || spot; return computeDay(x, sp, dd, ctxFor(dd, x)); } };
    if (CFG.CHAT_ENDPOINT) {
      try {
        const r = await fetch(CFG.CHAT_ENDPOINT, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ q: text, context: { corridor: cor.name, species: SPX[sp].name, spot: spot.name, brief: spot.brief, conditions: condLine, date: iso(date) } }) });
        const j = await r.json();
        if (j && j.text) { setChat((c) => ({ ...c, msgs: [...c.msgs, { me: false, t: j.text }] })); return; }
      } catch (e) {}
    }
    const a = localAnswer(text, env);
    setChat((c) => ({ ...c, msgs: [...c.msgs, { me: false, t: a.text }] }));
    if (a.pickId) { const s = SPOTS.find((x) => x.id === a.pickId); if (s) jumpToSpot(s); }
  };
  useEffect(() => { if (chat.open && endRef.current) endRef.current.scrollIntoView({ behavior: "smooth" }); }, [chat]);

  /* ---------- styles ---------- */
  const card = { background: C.panel, border: `1px solid ${C.line}`, borderRadius: 14, padding: 14 };
  const label = { fontFamily: F.mono, fontSize: 10.5, letterSpacing: 1.2, color: C.dim, textTransform: "uppercase", marginBottom: 8 };
  const h = { fontFamily: F.disp, fontWeight: 700, textTransform: "uppercase", letterSpacing: 0.5 };

  const svg = dm && ctxToday.events ? (() => {
    const W = 340, H = 150, topPad = 24, botPad = 26;
    const t0 = new Date(date); t0.setHours(4, 0, 0, 0); const t1 = new Date(date); t1.setHours(23, 0, 0, 0);
    const x = (t) => ((t - t0) / (t1 - t0)) * W;
    const pts = [];
    for (let i = 0; i <= 76; i++) { const t = new Date(t0.getTime() + (t1 - t0) * i / 76); const ts = tideStateAt(ctxToday.events, t); pts.push({ t, v: ts ? ts.h : 0 }); }
    const mn = Math.min(...pts.map(p => p.v)) - 0.2, mx = Math.max(...pts.map(p => p.v)) + 0.2;
    const y = (v) => topPad + (1 - (v - mn) / (mx - mn || 1)) * (H - topPad - botPad);
    const path = pts.map((p, i) => `${i === 0 ? "M" : "L"}${x(p.t).toFixed(1)},${y(p.v).toFixed(1)}`).join(" ");
    const hrs = [6, 9, 12, 15, 18, 21];
    const evs = ctxToday.events.filter((e) => e.date >= t0 && e.date <= t1);
    const sunT = ctxToday.sun ? [{ t: ctxToday.sun.rise, l: "SR" }, { t: ctxToday.sun.set, l: "SS" }].filter((s2) => s2.t >= t0 && s2.t <= t1) : [];
    const isToday = iso(date) === iso(today);
    const nowX = isToday && now >= t0 && now <= t1 ? x(now) : null;
    const nowTs = nowX != null ? tideStateAt(ctxToday.events, now) : null;
    const scrubFromClientX = (el, cx) => {
      const rect = el.getBoundingClientRect();
      if (!rect.width) return;
      const frac = clamp((cx - rect.left) / rect.width, 0, 1);
      const t = new Date(t0.getTime() + Math.round(frac * (t1 - t0) / 600000) * 600000);
      setScrubT(t);
    };
    const scrubX = scrubT && scrubT >= t0 && scrubT <= t1 ? x(scrubT) : null;
    const scrubTs = scrubX != null ? tideStateAt(ctxToday.events, scrubT) : null;
    return (
      <svg viewBox={`0 0 ${W} ${H}`} style={{ width: "100%", height: "auto", touchAction: "pan-y", cursor: "crosshair" }}
        onMouseMove={(e) => scrubFromClientX(e.currentTarget, e.clientX)}
        onMouseLeave={() => setScrubT(null)}
        onTouchStart={(e) => e.touches[0] && scrubFromClientX(e.currentTarget, e.touches[0].clientX)}
        onTouchMove={(e) => e.touches[0] && scrubFromClientX(e.currentTarget, e.touches[0].clientX)}
        onTouchEnd={() => setScrubT(null)}>
        {hrs.map((h2) => { const t = new Date(date); t.setHours(h2, 0, 0, 0); const xx = x(t); return (
          <g key={h2}>
            <line x1={xx} x2={xx} y1={topPad - 4} y2={H - botPad + 4} stroke={C.line} strokeWidth="1" />
            <text x={xx} y={H - 8} textAnchor="middle" fill={C.dim} fontSize="9" fontFamily="IBM Plex Mono">{h2 > 12 ? h2 - 12 : h2}{h2 >= 12 ? "p" : "a"}</text>
          </g>
        ); })}
        {dm.windows.map(([a, b2], i) => { const ta = new Date(date); ta.setHours(a, 0, 0, 0); const tb = new Date(date); tb.setHours(b2 + 1, 0, 0, 0); const xa = Math.max(0, x(ta)), xb = Math.min(W, x(tb)); return (
          <g key={"w" + i}>
            <rect x={xa} y={topPad - 4} width={xb - xa} height={H - topPad - botPad + 8} fill={C.blaze} opacity="0.13" />
            <line x1={xa} x2={xa} y1={topPad - 4} y2={H - botPad + 4} stroke={C.blaze} strokeWidth="1" opacity="0.5" />
            <line x1={xb} x2={xb} y1={topPad - 4} y2={H - botPad + 4} stroke={C.blaze} strokeWidth="1" opacity="0.5" />
            {(xb - xa) >= 62 && <text x={(xa + xb) / 2} y={13} textAnchor="middle" fill={C.blaze} fontSize="9.5" fontFamily="IBM Plex Mono">BITE {a > 12 ? a - 12 : a}{a >= 12 ? "P" : "A"}-{b2 > 12 ? b2 - 12 : b2}{b2 >= 12 ? "P" : "A"}</text>}
          </g>
        ); })}
        <path d={path} fill="none" stroke={C.water} strokeWidth="2.5" />
        {evs.map((e, i) => (
          <circle key={"e" + i} cx={x(e.date)} cy={y(e.v)} r="3.5" fill={e.hl === "H" ? C.bone : C.stone} />
        ))}
        {sunT.map((s2, i) => (
          <line key={"s" + i} x1={x(s2.t)} x2={x(s2.t)} y1={topPad - 4} y2={topPad + 5} stroke={C.moss} strokeWidth="2" />
        ))}
        {nowX != null && (
          <g>
            <line x1={nowX} x2={nowX} y1={topPad - 4} y2={H - botPad + 4} stroke={C.bone} strokeWidth="1" strokeDasharray="3,3" opacity="0.8" />
            {nowTs && <circle cx={nowX} cy={y(nowTs.h)} r="4.5" fill={C.blaze} />}
          </g>
        )}
        {scrubX != null && (
          <g pointerEvents="none">
            <line x1={scrubX} x2={scrubX} y1={topPad - 4} y2={H - botPad + 4} stroke={C.blaze} strokeWidth="1.5" />
            {scrubTs && <circle cx={scrubX} cy={y(scrubTs.h)} r="5" fill={C.ink} stroke={C.blaze} strokeWidth="2.5" />}
            <text x={scrubX} y={topPad - 8} textAnchor={scrubX < 40 ? "start" : scrubX > W - 40 ? "end" : "middle"} fill={C.blaze} fontSize="10" fontFamily="IBM Plex Mono">{clock(scrubT)}</text>
          </g>
        )}
      </svg>
    );
  })() : null;

  return (

                  {user.user_metadata && user.user_metadata.avatar_url
                    ? <img src={user.user_metadata.avatar_url} alt="Profile" referrerPolicy="no-referrer" style={{ width: "100%", height: "100%", objectFit: "cover", display: "block" }} />

                </button>

              {user && profOpen && (

                  <div style={{ fontWeight: 700, fontSize: 15 }}>{(user.user_metadata && user.user_metadata.full_name) || "Angler"}</div>
                  <div style={{ fontFamily: F.mono, fontSize: 10.5, color: C.dim, marginTop: 2, overflowWrap: "anywhere" }}>{user.email}</div>
                  <div style={{ fontFamily: F.mono, fontSize: 10.5, color: C.moss, marginTop: 10, letterSpacing: 0.5 }}>SAVED: {favSpotIds.length} SPOT{favSpotIds.length === 1 ? "" : "S"} · {favPlaces.length} PLACE{favPlaces.length === 1 ? "" : "S"} · LOG: {catches.length}{catches.length === 6 ? "+" : ""}</div>
                  <div style={{ fontSize: 12.5, color: C.dim, marginTop: 6, lineHeight: 1.45 }}>Your favorites lead the home screen. Save spots with the star on any call, save places from the search card.</div>
                  <button onClick={signOut} style={{ marginTop: 12, width: "100%", background: "none", border: `1px solid ${C.line}`, color: C.stone, borderRadius: 8, padding: "9px 10px", fontFamily: F.mono, fontSize: 10.5, letterSpacing: 1, cursor: "pointer" }}>SIGN OUT</button>
                </div>
              )}
            </div>
          )}
        </div>
        <div style={{ fontFamily: F.mono, fontSize: 10.5, color: C.dim, letterSpacing: 1, marginTop: 5 }}>THE GUIDE'S CALL · 30 DAYS OUT</div>
        <div style={{ fontFamily: F.mono, fontSize: 10, color: C.dim, margin: "4px 0 14px", opacity: 0.8 }}>Board recomputed {clock(now)} · live data refreshes every visit</div>

        {view === "home" && (
          <div>
            <div style={{ margin: "24px 0 8px", ...h, fontSize: "clamp(32px, 10vw, 46px)", lineHeight: 1.04 }}>WHERE ARE YOU FISHING?</div>
            <div style={{ color: C.stone, fontSize: 15, lineHeight: 1.55, marginBottom: 14 }}>Live scores, real tides, and a 30-day outlook for {SPOTS.length} fly spots from Maine to the Bahamas. Type a town, pick your fish, or tap a pin.</div>
            {hitRate && (
              <div style={{ fontFamily: F.mono, fontSize: 10.5, color: C.moss, letterSpacing: 0.6, marginBottom: 12, lineHeight: 1.6 }}>THE RECORD: OUR 8+ CALLS FISHED DECENT OR BETTER {Math.round(100 * hitRate.hits8 / hitRate.n8)}% OF THE TIME · {hitRate.n8} ANGLER GRADES, WE COUNT THE SKUNKS TOO</div>
            )}
            {user && (yourWater.length > 0 || favPlaces.length > 0) && (
              <div style={{ background: C.panel, border: `1px solid ${C.blaze}44`, borderRadius: 14, padding: "12px 14px", marginBottom: 14 }}>

              {Object.keys(SPX).filter((k) => homeSpBest[k]).map((k) => (
                <option key={k} value={k}>{SPX[k].name} · best today: {homeSpBest[k].spot.name}, {to10(homeSpBest[k].peak)}/10</option>
              ))}
            </select>
            <div style={{ background: C.panel, border: `1px solid ${C.line}`, borderRadius: 14, overflow: "hidden", marginBottom: 14 }}>
              <div style={{ padding: "11px 14px 9px", fontFamily: F.mono, fontSize: 10.5, letterSpacing: 1.2, color: C.dim, textTransform: "uppercase" }}>The water · today's scores · tap a pin</div>
              <div style={{ position: "relative" }}>
                <div ref={mapRef} style={{ height: 300, width: "100%" }} />
                <button onClick={zoomMapToMe} title="Zoom to my location" aria-label="Zoom to my location"

                <input value={plan.place} onChange={(e) => { planCoords.current = null; setPlan({ ...plan, place: e.target.value }); }} onKeyDown={(e) => { if (e.key === "Enter") { if (planSugs[0]) pickPlanSug(planSugs[0]); else runPlan(); } }} placeholder="Town or zip you're staying near" type="search" autoComplete="off" autoCorrect="off" spellCheck={false}
                  style={{ width: "100%", background: C.ink, border: `1px solid ${C.line}`, color: C.bone, borderRadius: 10, padding: "12px 12px", outline: "none", fontFamily: F.body }} />
                {planSugs.length > 0 && (

                    {planSugs.map((s, i) => (

                  style={{ flex: 1.3, minWidth: 0, background: C.ink, border: `1px solid ${C.line}`, color: C.bone, borderRadius: 10, padding: "10px 8px", fontFamily: F.mono, fontSize: 12, outline: "none", colorScheme: "dark" }} />
                <select value={plan.nights} onChange={(e) => setPlan({ ...plan, nights: parseInt(e.target.value, 10) })}

                </select>

                      <a href={gmapsDir(d.la, d.lo)} target="_blank" rel="noopener" style={{ fontFamily: F.mono, fontSize: 11.5, color: C.blaze, textDecoration: "none" }}>RUN TO IT</a>
                    </div>
                    <div style={{ color: C.dim, fontSize: 13.5, marginTop: 3 }}>{d.note}</div>
                  </div>
                ))}
                <div style={{ fontFamily: F.mono, fontSize: 10.5, color: C.dim, marginTop: 8 }}>Not for navigation. Read your charts, idle the skinny stuff, give other anglers the room you'd want.</div>
              </div>
            )}
          </div>

          <div style={{ ...card, padding: 0, overflow: "hidden" }}>
            <div style={{ padding: "11px 14px 9px", fontFamily: F.mono, fontSize: 10.5, letterSpacing: 1.2, color: C.dim, textTransform: "uppercase" }}>
              On the chart · <span style={{ color: C.blaze }}>spot</span> · <span style={{ color: C.stone }}>ramps</span> · <span style={{ color: C.water }}>drops</span> · <span style={{ color: "#5A6468" }}>backups</span>
            </div>
            <div ref={spotMapRef} style={{ height: 240, width: "100%" }} />
            <div style={{ padding: "9px 14px 12px", fontFamily: F.mono, fontSize: 10, color: C.dim }}>Tap a ramp or drop for directions. Not for navigation.</div>
          </div>

          <div style={card}>
            <div style={label}>The fly box · {SPX[sp].short} · ranked for {DOW[date.getDay()]} {MN[date.getMonth()]} {date.getDate()}</div>
            <div style={{ fontFamily: F.mono, fontSize: 11, color: clarityFor(ctxToday) === "stained" ? C.blaze : C.moss, marginBottom: 10 }}>
              {clarityFor(ctxToday) === "stained" ? "WATER READS STAINED TODAY: LOUD, DARK, AND FLASH WIN" : "WATER READS CLEAR TODAY: NATURAL, SLIM, AND TRANSLUCENT WIN"}
            </div>
            {[["Dawn", "dawn"], ["Midday", "day"], ["Dusk", "dusk"], ["Night", "night"]].map(([lbl2, blk]) => {
              const top = rankFlies(sp, blk, clarityFor(ctxToday));
              return (
                <div key={blk} style={{ marginBottom: 10 }}>
                  <div style={{ fontFamily: F.mono, fontSize: 10, color: C.moss, letterSpacing: 1, textTransform: "uppercase" }}>{lbl2}</div>
                  {top.map(({ f }, i) => (
                    <div key={f.n} style={{ display: "flex", gap: 8, alignItems: "baseline", marginTop: 4 }}>
                      <div style={{ ...h, fontSize: 15, color: i === 0 ? C.blaze : C.stone, minWidth: 16 }}>{i + 1}</div>
                      <div style={{ fontSize: 13.5, lineHeight: 1.4 }}>
                        <span style={{ fontWeight: 600, color: C.bone }}>{f.n} {f.sz}</span>
                        <span style={{ color: C.dim }}> · {f.why}</span>
                      </div>
                    </div>
                  ))}
                </div>
              );
            })}
          </div>

          {ranking.length > 1 && (
            <div style={card}>
              <div style={label}>The milk run · backups</div>
              {ranking.filter((r) => r.spot.id !== spot.id).slice(0, 2).map((r) => (
                <button key={r.spot.id} onClick={() => { setSpotId(r.spot.id); setManual(true); scrollToHero(); }}
                  style={{ display: "flex", justifyContent: "space-between", alignItems: "center", width: "100%", background: C.tile, border: `1px solid ${C.line}`, borderRadius: 10, padding: "11px 12px", marginBottom: 8, cursor: "pointer", color: C.bone, textAlign: "left" }}>
                  <div><div style={{ fontWeight: 600, fontSize: 14.5 }}>{r.spot.name}</div><div style={{ color: C.dim, fontSize: 12.5 }}>{r.spot.area}</div></div>
                  <div style={{ ...h, fontSize: 22, color: r.peak >= 70 ? C.blaze : C.stone }}>{to10(r.peak)}</div>
                </button>
              ))}
            </div>
          )}

          <div style={{ ...card, background: "transparent", padding: 0 }}>
            <button onClick={() => setShowLib(!showLib)} style={{ display: "flex", justifyContent: "space-between", alignItems: "center", width: "100%", background: "none", border: "none", color: C.dim, padding: 16, cursor: "pointer" }}>
              <span style={{ fontFamily: F.mono, fontSize: 10.5, letterSpacing: 1.2, textTransform: "uppercase" }}>The law</span>
              <span style={{ fontFamily: F.mono, fontSize: 12 }}>{showLib ? "HIDE" : "SHOW"}</span>
            </button>
            {showLib && (
            <div style={{ fontSize: 13, color: C.dim, lineHeight: 1.6, padding: "0 16px 16px" }}>
              Regs change yearly, check before you fish: {cor.regs.map((r, i) => <span key={i}><a href={r.u} target="_blank" rel="noopener" style={{ color: C.moss }}>{r.n}</a>{i < cor.regs.length - 1 ? " · " : ""}</span>)}
              <br /><br />{cor.accessLaw}
              <br /><br /><span style={{ fontFamily: F.mono, fontSize: 10.5 }}>Scores are a planning aid, not a promise. Tides: NOAA. Weather: Open-Meteo. Not for navigation.</span>
            </div>
            )}
          </div>
        </div>
        </React.Fragment>)}
      </div>

      {/* reset, bottom right */}
      <button onClick={() => { location.hash = ""; location.reload(); }} title="Reset"
        style={{ position: "fixed", right: 16, bottom: view === "spot" ? 78 : 16, zIndex: 54, background: C.panel, border: `1px solid ${C.line}`, color: C.dim, borderRadius: 8, padding: "8px 12px", fontFamily: F.mono, fontSize: 10.5, letterSpacing: 1, cursor: "pointer", boxShadow: "0 6px 18px rgba(0,0,0,.4)" }}>RESET</button>

      {/* sign in */}
      {SB && authOpen && (
        <div onClick={() => setAuthOpen(false)} style={{ position: "fixed", inset: 0, zIndex: 90, background: "rgba(10,13,14,.72)", display: "flex", alignItems: "center", justifyContent: "center", padding: 18 }}>
          <div onClick={(e) => e.stopPropagation()} style={{ width: "100%", maxWidth: 360, background: C.panel2, border: `1px solid ${C.line}`, borderRadius: 16, padding: 18 }}>
            <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center" }}>
              <div style={{ ...h, fontSize: 22 }}>SIGN IN</div>
              <button onClick={() => setAuthOpen(false)} style={{ background: "none", border: "none", color: C.dim, fontSize: 22, cursor: "pointer", lineHeight: 1, padding: 4 }}>×</button>
            </div>
            <div style={{ fontSize: 13.5, color: C.stone, lineHeight: 1.5, margin: "6px 0 14px" }}>Save your spots and places, they lead the home screen on every device. No password, no spam.</div>
            {CFG.AUTH_GOOGLE && <button onClick={signInGoogle} style={{ width: "100%", background: C.bone, color: C.ink, border: "none", borderRadius: 10, padding: "12px 12px", fontFamily: F.disp, fontWeight: 700, fontSize: 16, letterSpacing: 0.5, cursor: "pointer" }}>CONTINUE WITH GOOGLE</button>}
            {!CFG.AUTH_GOOGLE && <input value={authEmail} onChange={(e) => setAuthEmail(e.target.value)} onKeyDown={(e) => e.key === "Enter" && sendMagicLink()} placeholder="you@email.com" type="email" autoComplete="email"
              style={{ width: "100%", background: C.ink, border: `1px solid ${C.line}`, color: C.bone, borderRadius: 10, padding: "12px 12px", outline: "none", fontFamily: F.body }} />}
            {!CFG.AUTH_GOOGLE && <button onClick={sendMagicLink} style={{ width: "100%", marginTop: 8, background: "none", border: `1px solid ${C.moss}`, color: C.moss, borderRadius: 10, padding: "11px 12px", fontFamily: F.mono, fontSize: 11.5, letterSpacing: 1, cursor: "pointer" }}>EMAIL ME A SIGN IN LINK</button>}
            {authMsg && <div style={{ fontFamily: F.mono, fontSize: 11, color: C.stone, marginTop: 10, lineHeight: 1.5 }}>{authMsg}</div>}
          </div>
        </div>
      )}

      {SB && logOpen && (
        <div onClick={() => setLogOpen(false)} style={{ position: "fixed", inset: 0, zIndex: 90, background: "rgba(10,13,14,.72)", display: "flex", alignItems: "center", justifyContent: "center", padding: 18 }}>
          <div onClick={(e) => e.stopPropagation()} style={{ width: "100%", maxWidth: 360, background: C.panel2, border: `1px solid ${C.line}`, borderRadius: 16, padding: 18 }}>
            <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center" }}>
              <div style={{ ...h, fontSize: 22 }}>LOG A FISH</div>
              <button onClick={() => setLogOpen(false)} style={{ background: "none", border: "none", color: C.dim, fontSize: 22, cursor: "pointer", lineHeight: 1, padding: 4 }}>×</button>
            </div>
            <div style={{ fontFamily: F.mono, fontSize: 10.5, color: C.dim, margin: "4px 0 12px", letterSpacing: 0.6 }}>{spot.name.toUpperCase()} · TIDE, WIND, TEMP, MOON, AND THE SCORE SAVE WITH IT</div>
            <select value={logForm.species} onChange={(e) => setLogForm({ ...logForm, species: e.target.value })}
              style={{ width: "100%", background: C.ink, border: `1px solid ${C.line}`, color: C.bone, borderRadius: 10, padding: "12px 10px", fontFamily: F.body, fontSize: 15, outline: "none" }}>
              {Object.keys(spot.sp).filter((k) => spot.sp[k] > 0).map((k) => <option key={k} value={k}>{SPX[k].name}</option>)}
            </select>
            <input value={logForm.len} onChange={(e) => setLogForm({ ...logForm, len: e.target.value })} placeholder="Length in inches (optional)" inputMode="decimal"
              style={{ width: "100%", marginTop: 8, background: C.ink, border: `1px solid ${C.line}`, color: C.bone, borderRadius: 10, padding: "12px 12px", outline: "none", fontFamily: F.body }} />
            <input value={logForm.fly} onChange={(e) => setLogForm({ ...logForm, fly: e.target.value })} onKeyDown={(e) => e.key === "Enter" && saveCatch()} placeholder="Fly (optional)"
              style={{ width: "100%", marginTop: 8, background: C.ink, border: `1px solid ${C.line}`, color: C.bone, borderRadius: 10, padding: "12px 12px", outline: "none", fontFamily: F.body }} />
            <button onClick={saveCatch} style={{ width: "100%", marginTop: 12, background: C.blaze, color: C.ink, border: "none", borderRadius: 10, padding: "12px", fontFamily: F.disp, fontWeight: 700, fontSize: 16, letterSpacing: 0.5, cursor: "pointer" }}>LOG IT</button>
            {logMsg && <div style={{ fontFamily: F.mono, fontSize: 11, color: logMsg.startsWith("Logged") ? C.ok : C.stone, marginTop: 10 }}>{logMsg}</div>}
          </div>
        </div>
      )}

      {/* chat */}
      {view === "spot" && (
      <button onClick={openChat}
        style={{ position: "fixed", right: 16, bottom: 16, zIndex: 60, background: C.blaze, color: C.ink, border: "none", borderRadius: 28, padding: "14px 18px", fontFamily: F.disp, fontWeight: 700, fontSize: 16, letterSpacing: 0.5, cursor: "pointer", boxShadow: "0 8px 24px rgba(0,0,0,.45)" }}>
        {chat.open ? "CLOSE" : "ASK THE GUIDE"}
      </button>
      )}
      {view === "spot" && chat.open && (
        <div style={{ position: "fixed", left: 0, right: 0, bottom: 0, top: "22%", zIndex: 55, background: C.panel2, borderTop: `2px solid ${C.blaze}`, borderRadius: "18px 18px 0 0", display: "flex", flexDirection: "column", maxWidth: 760, margin: "0 auto" }}>
          <div style={{ padding: "14px 16px 4px", ...h, fontSize: 20, color: C.bone }}>THE HEAD GUIDE <span style={{ fontFamily: F.mono, fontSize: 10, color: C.dim, letterSpacing: 1, fontWeight: 400 }}>{CFG.CHAT_ENDPOINT ? "· FULL AI" : "· LOCAL KNOWLEDGE"}</span></div>
          <div style={{ padding: "0 16px 8px", fontFamily: F.mono, fontSize: 10.5, color: C.moss, letterSpacing: 0.5 }}>ON: {spot.name.toUpperCase()} · {dm ? to10(dm.peak) : "?"}/10 · {DOW[date.getDay()].toUpperCase()} {MN[date.getMonth()].toUpperCase()} {date.getDate()} · {SPX[sp].short.toUpperCase()}</div>
          <div style={{ flex: 1, overflowY: "auto", padding: "4px 16px" }}>
            {chat.msgs.map((m, i) => (
              <div key={i} style={{ display: "flex", justifyContent: m.me ? "flex-end" : "flex-start", marginBottom: 8 }}>
                <div style={{ maxWidth: "85%", background: m.me ? C.mossDeep : C.panel, border: `1px solid ${C.line}`, color: C.bone, borderRadius: 12, padding: "10px 12px", fontSize: 14.5, lineHeight: 1.5, whiteSpace: "pre-wrap" }}>{m.t}</div>
              </div>
            ))}
            <div ref={endRef} />
          </div>
          <div style={{ display: "flex", gap: 8, padding: "10px 16px 16px" }}>
            {["Where Saturday?", "Why this score?", "What tide tonight?"].map((c) => (
              <button key={c} onClick={() => send(c)} style={{ fontFamily: F.mono, fontSize: 11, background: C.panel, color: C.dim, border: `1px solid ${C.line}`, borderRadius: 8, padding: "6px 8px", cursor: "pointer", whiteSpace: "nowrap" }}>{c}</button>
            ))}
          </div>
          <div style={{ display: "flex", gap: 8, padding: "0 16px 18px" }}>
            <input value={draft} onChange={(e) => setDraft(e.target.value)} onKeyDown={(e) => e.key === "Enter" && send()} placeholder="Ask about spots, flies, seasons, tides..."
              style={{ flex: 1, background: C.ink, border: `1px solid ${C.line}`, color: C.bone, borderRadius: 10, padding: "12px 12px", fontSize: 14.5, outline: "none", fontFamily: F.body }} />
            <button onClick={() => send()} style={{ background: C.blaze, color: C.ink, border: "none", borderRadius: 10, padding: "0 18px", fontWeight: 700, cursor: "pointer", fontFamily: F.disp, fontSize: 15 }}>SEND</button>
          </div>
        </div>
      )}
    </div>
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
