    a += why.length ? `, but today fights you: ${why.join(" and ")}. The season is right, the day is not` : `, but today's conditions knock the call down`;

const confidence = (dayOffset, spot) => {
  const tideC = spot.station ? (spot.lag ? 0.88 : 0.96) : (CFG.WORLDTIDES_KEY ? 0.9 : 0.5);
  const wxC = dayOffset <= 2 ? 0.92 : dayOffset <= 5 ? 0.84 : dayOffset <= 10 ? 0.7 : dayOffset <= 15 ? 0.56 : 0.36;

};
const confLabel = (c) => c >= 85 ? "Locked in" : c >= 70 ? "Solid" : c >= 55 ? "Lean" : "Directional";

/* ---------- species verdicts for search ---------- */
const verdicts = (cid, date) => {
  const c = corrById(cid);
  return Object.keys(SPX).map((sp) => {
    const arr = c.seasonal[sp];
    if (!arr) return { sp, label: "Not this water", tone: "off" };
    const now = lerpArr(arr, date);
    const mx = Math.max(...arr);
    const peakMs = arr.map((v, i) => [v, i]).filter(([v]) => v >= mx * 0.85).map(([, i]) => i);
    const range = peakMs.length ? `${MN[peakMs[0]]}${peakMs.length > 1 ? " to " + MN[peakMs[peakMs.length - 1]] : ""}` : "";
    if (now >= 0.65) return { sp, label: "Recommended now", tone: "hot" };
    if (now >= 0.3) return { sp, label: `In season, peaks ${range}`, tone: "ok" };
    if (mx >= 0.3) return { sp, label: `Not likely now, best ${range}`, tone: "cool" };
    return { sp, label: "Not this water", tone: "off" };
  });
};

/* ---------- search suggest ---------- */
const SP_ALIASES = { striper: ["striper", "stripers", "striped bass", "bass"], albie: ["albie", "albies", "false albacore", "albacore", "little tunny", "funny fish"], tarpon: ["tarpon", "poon", "silver king"], snook: ["snook", "linesider"], redfish: ["redfish", "reds", "red drum"], bonefish: ["bonefish", "bones", "grey ghost"] };
const suggestFor = (qRaw, curCid) => {
  const q = qRaw.trim().toLowerCase(); if (!q) return [];
  const out = [];
  if (/^\d/.test(q)) {
    CORR.forEach((c) => { if ((c.zips || []).some((p) => p.startsWith(q) || q.startsWith(p))) out.push({ t: "place", label: q.length >= 5 ? q : "ZIP " + q + "...", sub: c.name, cid: c.id }); });
    return out.slice(0, 6);
  }
  Object.keys(SP_ALIASES).forEach((sp) => { if (SP_ALIASES[sp].some((a) => a.startsWith(q) || q.startsWith(a))) out.push({ t: "sp", label: SPX[sp].name, sub: "species", sp }); });
  CORR.forEach((c) => {
    if (c.name.toLowerCase().includes(q)) out.push({ t: "place", label: c.name, sub: "region", cid: c.id });
    (c.towns || []).forEach((tn) => { const k = tn.toLowerCase(); if (k.startsWith(q) || (q.length >= 3 && k.includes(q))) out.push({ t: "place", label: tn, sub: c.short, cid: c.id }); });
  });
  if (q.length >= 3) {
    const sorted = [...SPOTS].sort((a, b) => (a.c === curCid ? 0 : 1) - (b.c === curCid ? 0 : 1));
    sorted.forEach((s) => { if (s.name.toLowerCase().includes(q) || (s.al || []).some((a) => a.includes(q))) out.push({ t: "spot", label: s.name, sub: s.area, cid: s.c, id: s.id }); });
  }
  const seen = new Set();
  return out.filter((x) => { const k = x.t + x.label; if (seen.has(k)) return false; seen.add(k); return true; }).slice(0, 7);
};

/* ---------- chat local engine ---------- */

const fmtWin = (ws) => ws.map(([a, b]) => `${a > 12 ? a - 12 : a}${a >= 12 ? "p" : "a"} to ${b > 12 ? b - 12 : b}${b >= 12 ? "p" : "a"}`).join(", ");
const DAYFULL = ["sunday", "monday", "tuesday", "wednesday", "thursday", "friday", "saturday"];
const parseDay = (s, today) => {
  if (/\btoday\b|\btonight\b|this morning|this evening/.test(s)) return dayStart(today);
  if (/\btomorrow\b/.test(s)) return addDays(dayStart(today), 1);
  for (let i = 0; i < 7; i++) { if (new RegExp("\\b" + DAYFULL[i] + "\\b").test(s)) { const t = dayStart(today); let off = (i - t.getDay() + 7) % 7; if (off === 0) off = 7; return addDays(t, off); } }
  const m = s.match(/\bin (\d{1,2}) days?\b/); if (m) return addDays(dayStart(today), parseInt(m[1]));
  return null;
};

const parseMonth = (s) => { for (let i = 0; i < 12; i++) { if (s.includes(MONFULL[i])) return i; } return null; };

      {SB && logOpen && (
        <div onClick={() => setLogOpen(false)} style={{ position: "fixed", inset: 0, zIndex: 90, background: "rgba(10,13,14,.72)", display: "flex", alignItems: "center", justifyContent: "center", padding: 18 }}>
          <div onClick={(e) => e.stopPropagation()} style={{ width: "100%", maxWidth: 360, background: C.panel2, border: `1px solid ${C.line}`, borderRadius: 16, padding: 18 }}>
            <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center" }}>
              <div style={{ ...h, fontSize: 22 }}>LOG A FISH</div>
              <button onClick={() => setLogOpen(false)} style={{ background: "none", border: "none", color: C.dim, fontSize: 22, cursor: "pointer", lineHeight: 1, padding: 4 }}>×</button>
            </div>
            <div style={{ fontFamily: F.mono, fontSize: 10.5, color: C.dim, margin: "4px 0 12px", letterSpacing: 0.6 }}>{spot.name.toUpperCase()} · TIDE, WIND, TEMP, MOON, AND THE SCORE SAVE WITH IT</div>
            <select value={logForm.species} onChange={(e) => setLogForm({ ...logForm, species: e.target.value })}
              style={{ width: "100%", background: C.ink, border: `1px solid ${C.line}`, color: C.bone, borderRadius: 10, padding: "12px 10px", fontFamily: F.body, fontSize: 15, outline: "none" }}>
              {Object.keys(spot.sp).filter((k) => spot.sp[k] > 0).map((k) => <option key={k} value={k}>{SPX[k].name}</option>)}
            </select>
            <input value={logForm.len} onChange={(e) => setLogForm({ ...logForm, len: e.target.value })} placeholder="Length in inches (optional)" inputMode="decimal"
              style={{ width: "100%", marginTop: 8, background: C.ink, border: `1px solid ${C.line}`, color: C.bone, borderRadius: 10, padding: "12px 12px", outline: "none", fontFamily: F.body }} />
            <input value={logForm.fly} onChange={(e) => setLogForm({ ...logForm, fly: e.target.value })} onKeyDown={(e) => e.key === "Enter" && saveCatch()} placeholder="Fly (optional)"
              style={{ width: "100%", marginTop: 8, background: C.ink, border: `1px solid ${C.line}`, color: C.bone, borderRadius: 10, padding: "12px 12px", outline: "none", fontFamily: F.body }} />
            <button onClick={saveCatch} style={{ width: "100%", marginTop: 12, background: C.blaze, color: C.ink, border: "none", borderRadius: 10, padding: "12px", fontFamily: F.disp, fontWeight: 700, fontSize: 16, letterSpacing: 0.5, cursor: "pointer" }}>LOG IT</button>
            {logMsg && <div style={{ fontFamily: F.mono, fontSize: 11, color: logMsg.startsWith("Logged") ? C.ok : C.stone, marginTop: 10 }}>{logMsg}</div>}
          </div>
        </div>
      )}

      {/* chat */}
      {view === "spot" && (
      <button onClick={openChat}
        style={{ position: "fixed", right: 16, bottom: 16, zIndex: 60, background: C.blaze, color: C.ink, border: "none", borderRadius: 28, padding: "14px 18px", fontFamily: F.disp, fontWeight: 700, fontSize: 16, letterSpacing: 0.5, cursor: "pointer", boxShadow: "0 8px 24px rgba(0,0,0,.45)" }}>
        {chat.open ? "CLOSE" : "ASK THE GUIDE"}
      </button>
      )}
      {view === "spot" && chat.open && (
        <div style={{ position: "fixed", left: 0, right: 0, bottom: 0, top: "22%", zIndex: 55, background: C.panel2, borderTop: `2px solid ${C.blaze}`, borderRadius: "18px 18px 0 0", display: "flex", flexDirection: "column", maxWidth: 760, margin: "0 auto" }}>
          <div style={{ padding: "14px 16px 4px", ...h, fontSize: 20, color: C.bone }}>THE HEAD GUIDE <span style={{ fontFamily: F.mono, fontSize: 10, color: C.dim, letterSpacing: 1, fontWeight: 400 }}>{CFG.CHAT_ENDPOINT ? "· FULL AI" : "· LOCAL KNOWLEDGE"}</span></div>
          <div style={{ padding: "0 16px 8px", fontFamily: F.mono, fontSize: 10.5, color: C.moss, letterSpacing: 0.5 }}>ON: {spot.name.toUpperCase()} · {dm ? to10(dm.peak) : "?"}/10 · {DOW[date.getDay()].toUpperCase()} {MN[date.getMonth()].toUpperCase()} {date.getDate()} · {SPX[sp].short.toUpperCase()}</div>
          <div style={{ flex: 1, overflowY: "auto", padding: "4px 16px" }}>
            {chat.msgs.map((m, i) => (
              <div key={i} style={{ display: "flex", justifyContent: m.me ? "flex-end" : "flex-start", marginBottom: 8 }}>
                <div style={{ maxWidth: "85%", background: m.me ? C.mossDeep : C.panel, border: `1px solid ${C.line}`, color: C.bone, borderRadius: 12, padding: "10px 12px", fontSize: 14.5, lineHeight: 1.5, whiteSpace: "pre-wrap" }}>{m.t}</div>
              </div>
            ))}
            <div ref={endRef} />
          </div>
          <div style={{ display: "flex", gap: 8, padding: "10px 16px 16px" }}>
            {["Where Saturday?", "Why this score?", "What tide tonight?"].map((c) => (
              <button key={c} onClick={() => send(c)} style={{ fontFamily: F.mono, fontSize: 11, background: C.panel, color: C.dim, border: `1px solid ${C.line}`, borderRadius: 8, padding: "6px 8px", cursor: "pointer", whiteSpace: "nowrap" }}>{c}</button>
            ))}
          </div>
          <div style={{ display: "flex", gap: 8, padding: "0 16px 18px" }}>
            <input value={draft} onChange={(e) => setDraft(e.target.value)} onKeyDown={(e) => e.key === "Enter" && send()} placeholder="Ask about spots, flies, seasons, tides..."
              style={{ flex: 1, background: C.ink, border: `1px solid ${C.line}`, color: C.bone, borderRadius: 10, padding: "12px 12px", fontSize: 14.5, outline: "none", fontFamily: F.body }} />
            <button onClick={() => send()} style={{ background: C.blaze, color: C.ink, border: "none", borderRadius: 10, padding: "0 18px", fontWeight: 700, cursor: "pointer", fontFamily: F.disp, fontSize: 15 }}>SEND</button>
          </div>
        </div>
      )}
    </div>
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
